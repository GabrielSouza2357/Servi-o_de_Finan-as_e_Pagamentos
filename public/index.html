<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Payments Hub - Autenticação</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body 
    class="
        bg-slate-50 text-slate-800 font-sans 
        antialiased min-h-screen 
        flex flex-col justify-between
    "
>

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div 
            class="container mx-auto px-6 py-4 flex justify-between items-center"
        >
            <h1 class="text-2xl font-bold">Finanças & Pagamentos Web</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="welcome-msg" class="text-sm font-medium"></span>
                <button 
                    id="btn-logout" 
                    class="
                        bg-indigo-700 hover:bg-indigo-800 text-xs 
                        px-3 py-1.5 rounded-lg transition
                    "
                >
                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container mx-auto px-6 py-8 flex-grow flex items-center justify-center">

        <!-- Seção de Autenticação (Login / Cadastro) -->
        <div 
            id="auth-section" 
            class="
                w-full max-w-md bg-white p-8 rounded-2xl 
                shadow-sm border border-slate-200 fade-in
            "
        >
            <div class="flex border-b border-slate-200 mb-6">
                <button 
                    id="tab-login" 
                    class="
                        w-1/2 pb-3 font-semibold text-indigo-600 
                        border-b-2 border-indigo-600 transition
                    "
                >
                    Entrar
                </button>
                <button 
                    id="tab-register" 
                    class="
                        w-1/2 pb-3 font-semibold text-slate-400 
                        border-b-2 border-transparent transition
                    "
                >
                    Cadastrar
                </button>
            </div>

            <!-- Formulário de Login -->
            <form id="form-login" class="space-y-4">
                <div>
                    <label 
                        class="block text-sm font-medium text-slate-600 mb-1"
                    >
                        E-mail
                    </label>
                    <input 
                        type="email" id="login-email" required 
                        class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
                    <input 
                        type="password" id="login-password" required 
                        class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                    >
                </div>
                <button 
                    type="submit" 
                    class="
                        w-full bg-indigo-600 hover:bg-indigo-700 
                        text-white font-medium py-2.5 rounded-lg transition
                    "
                >
                    Entrar na Conta
                </button>
                <div 
                    id="login-feedback" 
                    class="text-sm hidden text-center p-2 rounded-lg"
                >
                </div>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="form-register" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">
                        Nome Completo
                    </label>
                    <input 
                        type="text" id="reg-name" required 
                        class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
                    <input 
                        type="email" id="reg-email" required 
                        class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
                    <input 
                        type="password" id="reg-password" required 
                        class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                    >
                </div>
                <button 
                    type="submit" 
                    class="
                        w-full bg-indigo-600 hover:bg-indigo-700 
                        text-white font-medium py-2.5 rounded-lg transition
                    "
                >
                    Criar Conta
                </button>
                <div 
                    id="reg-feedback" class="text-sm hidden text-center p-2 rounded-lg"
                >
                </div>
            </form>
        </div>

        <!-- Painel Principal (Acessível após Login) -->
        <div 
            id="dashboard-section" 
            class="w-full hidden grid grid-cols-1 md:grid-cols-2 gap-8 py-4 fade-in"
        >

            <!-- CoinGecko API -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 
                    class="text-xl font-semibold text-indigo-600 mb-4 flex items-center gap-2"
                >
                    🪙 CoinGecko - Criptomoedas
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">
                            Selecione a Criptomoeda
                        </label>

                        <select 
                            id="crypto-select" 
                            class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                        >
                            <option value="bitcoin">Bitcoin (BTC)</option>
                            <option value="ethereum">Ethereum (ETH)</option>
                            <option value="cardano">Cardano (ADA)</option>
                        </select>
                    </div>

                    <button 
                        id="btn-fetch-crypto" 
                        class="
                            w-full bg-indigo-600 hover:bg-indigo-700 
                            text-white font-medium py-2.5 rounded-lg transition
                        "
                    >
                        Consultar Preço
                    </button>

                    <div 
                        id="crypto-result" 
                        class="bg-slate-50 p-4 rounded-lg border border-slate-100 text-sm hidden"
                    >
                    </div>
                </div>
            </section>

            <!-- Alpha Vantage API -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 
                    class="text-xl font-semibold text-indigo-600 mb-4 flex items-center gap-2"
                >
                    📈 Alpha Vantage - Ações
                </h2>

                <div class="space-y-4">
                    <div>
                        <label 
                            class="block text-sm font-medium text-slate-600 mb-1"
                        >
                            Símbolo da Ação (Ex: IBM, AAPL)
                        </label>

                        <input 
                            type="text" 
                            id="stock-symbol" 
                            value="IBM" 
                            class="w-full border border-slate-300 rounded-lg p-2.5 outline-none uppercase"
                        >
                    </div>

                    <button 
                        id="btn-fetch-stock" 
                        class="
                            w-full bg-indigo-600 hover:bg-indigo-700 
                            text-white font-medium py-2.5 rounded-lg transition
                        "
                    >
                        Consultar Cotação
                    </button>

                    <div 
                        id="stock-result" 
                        class="bg-slate-50 p-4 rounded-lg border border-slate-100 text-sm hidden"
                    >
                    </div>
                </div>
            </section>

            <!-- Stripe API -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 
                    class="text-xl font-semibold text-indigo-600 mb-4 flex items-center gap-2"
                >
                    💳 Stripe API - Cartão
                </h2>

                <div class="space-y-4">
                    <p class="text-sm text-slate-500">
                        Simule o processamento seguro de pagamentos.
                    </p>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">
                            Valor (USD)
                        </label>
                        <input 
                            type="number" 
                            id="stripe-amount" 
                            value="50.00" 
                            class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                        >
                    </div>
                    <button 
                        id="btn-pay-stripe" 
                        class="
                            w-full bg-emerald-600 hover:bg-emerald-700 
                            text-white font-medium py-2.5 rounded-lg transition
                        "
                    >
                        Pagar com Stripe
                    </button>
                    <div 
                        id="stripe-result" 
                        class="bg-slate-50 p-4 rounded-lg border border-slate-100 text-sm hidden"
                    >
                    </div>
                </div>
            </section>

            <!-- PayPal API -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 
                    class="text-xl font-semibold text-indigo-600 mb-4 flex items-center gap-2"
                >
                    🆚 PayPal API - Checkout
                </h2>
                <div class="space-y-4">
                    <p class="text-sm text-slate-500">
                        Integração para pagamento via carteira digital.
                    </p>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">
                            Valor (USD)
                        </label>
                        
                        <input 
                            type="number" id="paypal-amount" value="100.00" 
                            class="w-full border border-slate-300 rounded-lg p-2.5 outline-none"
                        >
                    </div>
                    
                    <button 
                        id="btn-pay-paypal" 
                        class="
                            w-full bg-blue-600 hover:bg-blue-700 text-white 
                            font-medium py-2.5 rounded-lg transition
                        "
                    >
                        Checkout PayPal
                    </button>
                    
                    <div 
                        id="paypal-result" 
                        class="bg-slate-50 p-4 rounded-lg border border-slate-100 text-sm hidden">
                    
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Projeto Cliente/Servidor Web - Finanças e Pagamentos &copy; 2026
    </footer>

    <!-- Scripts Modulares -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
